<!DOCTYPE html>
<html>
<head>
    <title>Maven Quiz App</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            text-align: center;
            padding-top: 80px;
        }
        .card {
            background: white;
            width: 480px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 12px gray;
        }
        button {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0078d7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Maven JSON Quiz App</h1>
    <p><b>Question:</b> What is Maven used for?</p>

    <button onclick="checkAnswer('A')">A. Designing UI</button>
    <button onclick="checkAnswer('B')">B. Build automation and dependency management</button>

    <p id="result"></p>
</div>

<script>
function checkAnswer(answer) {
    if (answer === "B") {
        document.getElementById("result").innerHTML =
        "Correct Answer! Score: 1/1<br>Build Successful Quiz Completed.";
    } else {
        document.getElementById("result").innerHTML =
        "Wrong Answer! Score: 0/1<br>Try again.";
    }
}
</script>

</body>
</html>
